<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYCTOHYLOPHOBIA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #click-prompt {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #88a3b7; font-size: 14px; letter-spacing: 2px;
            text-align: center;
        }

        #vhs-canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
            filter: blur(0.5px) contrast(1.15) brightness(1.05);
            opacity: 0.85;
        }

        #vhs-ui {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 6;
            color: #e6e6e6;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .vhs-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .vhs-row-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .vhs-tag {
            color: #45e06e;
        }

        .zoom-indicator {
            font-size: 14px;
            color: #aaa;
        }

        #level-clear {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff; font-size: 24px; letter-spacing: 6px;
            text-shadow: 0 0 20px #ffffff;
            display: none;
            z-index: 20;
            text-align: center;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
    <div id="hud">
        <div id="click-prompt">CLICK TO ENTER THE DARKNESS</div>
        <div id="level-clear">LEVEL 0 ESCAPED</div>
    </div>

    <div id="vhs-ui">
        <div class="vhs-row-top">
            <div><span class="vhs-tag">PLAY</span> &#9654;</div>
            <div id="vhs-timecode">TC 00:00:00:00</div>
        </div>
        <div class="vhs-row-bottom">
            <div>
                <div id="vhs-date">LEVEL 0: SAFE ZONE</div>
                <div id="vhs-clock" style="font-size: 14px; margin-top: 4px; color: #ccc;">23:42:11</div>
            </div>
            <div style="text-align: right;">
                <div class="zoom-indicator" id="vhs-zoom-val">OPTICAL ZOOM 1.0x</div>
                <div style="font-size: 14px; margin-top: 4px;">SP &#9632; [BATTERY ||||]</div>
            </div>
        </div>
    </div>

    <canvas id="vhs-canvas"></canvas>

    <script src="js/crosshair.js"></script>
    <script src="js/streetlamp.js"></script>
    <script src="js/vhs.js"></script>
    <script src="js/player.js"></script>
    <script src="js/world.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
